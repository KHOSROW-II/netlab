[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netlab"
version = "1.0.0"
description = "Interactive network simulation platform"
requires-python = ">=3.9"
dependencies = [
    "docker>=7.0.0",
    "pyyaml>=6.0",
    "networkx>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "httpx>=0.27.0"]
viz = ["netgraph>=4.13.0", "matplotlib>=3.7.0"]
web = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
]
# desktop adds pywebview. On Linux with Python 3.14, proxy_tools may need
# a manual install first: pip install proxy_tools && pip install pywebview --no-deps
desktop = [
    "pywebview>=4.4.1",
]

[project.scripts]
netlab = "netlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"netlab.web" = [
    "templates/*.html",
    "static/css/*.css",
    "static/js/*.js",
]