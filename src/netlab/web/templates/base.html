<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}NetLab{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <div id="splash-screen">
    <div class="splash-logo">◉</div>
    <h1 class="splash-title">NetLab</h1>
    <p class="splash-brand">POWRED BY <a href="https://github.com/KHOSROW-II" target="_blank">github.com/KHOSROW-II</a></p>
    <span class="splash-studio">(KOXXH STUDIO)</span>
    <div class="splash-loader"></div>
  </div>

  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">◉</span>
        <div class="brand-text">
          <span class="brand-name">NetLab</span>
          <span class="brand-version">v{{ version }}</span>
        </div>
      </div>
      
      <!-- Navigation Menu -->
      <nav class="nav">
        <a class="nav-item active" data-view="editor">
          <span class="nav-icon">◆</span><span>Editor</span>
        </a>
        <a class="nav-item" data-view="monitor">
          <span class="nav-icon">◈</span><span>Monitor</span>
        </a>
        <a class="nav-item" data-view="calculator">
          <span class="nav-icon">∑</span><span>Calculator</span>
        </a>
        <a class="nav-item" data-view="terminal">
          <span class="nav-icon">▶</span><span>Terminal</span>
        </a>
        <a class="nav-item" data-view="settings">
          <span class="nav-icon">⚙</span><span>Settings</span>
        </a>
        <a class="nav-item" data-view="diagnostics">
          <span class="nav-icon">?</span><span>Diagnostics</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <span id="topbar-status" class="status-pill">no cluster</span>
        <div class="branding">
          POWRED BY github.com/KHOSROW-II<br>
          <span class="studio">(KOXXH STUDIO)</span>
        </div>
      </div>
    </aside>

    <main class="content">
      <!-- Routing Banner (Shows on top of everything) -->
      <div id="routing-banner" class="banner banner-warn" hidden>
        <span id="routing-banner-text" class="banner-text">Routing disabled</span>
        <button id="routing-banner-fix" class="btn btn-sm">Try fix</button>
        <button id="routing-banner-dismiss" class="btn btn-sm btn-ghost">Dismiss</button>
      </div>
      
      <!-- Content injection point -->
      {% block content %}{% endblock %}
    </main>
  </div>

  <!-- Scripts loaded at the end -->
  <script src="/static/js/app.js"></script>
  <script src="/static/js/editor.js"></script>
  <script src="/static/js/monitor.js"></script>
  <script src="/static/js/calculator.js"></script>
</body>
</html>
