name: data-center
groups:
  - name: Web_Tier
    subnet: 10.1.1.0/24
    host_count: 3
    topology: switch
  - name: App_Tier
    subnet: 10.2.1.0/24
    host_count: 3
    topology: switch
  - name: DB_Tier
    subnet: 10.3.1.0/24
    host_count: 3
    topology: ring
  - name: Backbone
    subnet: 10.0.0.0/24
    host_count: 1
routers:
  - name: WebRouter
    connects: [Web_Tier, Backbone]
  - name: AppRouter
    connects: [App_Tier, Backbone]
  - name: DBRouter
    connects: [DB_Tier, Backbone]
