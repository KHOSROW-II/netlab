name: netlab-demo
image: nicolaka/netshoot:latest

groups:
  - name: grpA
    subnet: 10.10.0.0/24
    host_count: 3
    start_offset: 10
    gateway_offset: 1
    topology: bus

  - name: grpB
    subnet: 10.20.0.0/24
    host_count: 3
    topology: ring

  - name: grpC
    subnet: 10.30.0.0/24
    host_count: 2
    start_offset: 20
    topology: star

routers:
  - name: r1
    connects: [grpA, grpC]
    ip_suffix: 254

services:
  - type: dnsmasq
    group: grpA
    ip_suffix: 250
    upstream: 8.8.8.8
    dhcp_range: [100, 200]
